name: Ping IndexNow

on:
  push:
    branches:
      - gh-pages

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages deployment to finish
        run: sleep 75

      - name: Submit URL to IndexNow (Bing / Yandex / others)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "arjuna-garden-homestay.github.io",
              "key": "12ebc491873045399a20efc023a73a2f",
              "keyLocation": "https://arjuna-garden-homestay.github.io/Arjuna-Jogja/12ebc491873045399a20efc023a73a2f.txt",
              "urlList": [
                "https://arjuna-garden-homestay.github.io/Arjuna-Jogja/"
              ]
            }')
          echo "IndexNow response: $STATUS"
          case "$STATUS" in
            200|202) echo "✓ Accepted by IndexNow." ;;
            400) echo "✗ 400 — malformed request."; exit 1 ;;
            403) echo "✗ 403 — key not accessible or mismatch."; exit 1 ;;
            422) echo "✗ 422 — URL not under host, or keyLocation unreachable."; exit 1 ;;
            429) echo "✗ 429 — too many requests (rate-limited)."; exit 1 ;;
            *)    echo "✗ Unexpected response $STATUS"; exit 1 ;;
          esac
